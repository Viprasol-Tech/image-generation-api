[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "image-generation-api"
version = "0.1.0"
description = "FastAPI text-to-image generation API with pluggable providers and an offline fake."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Viprasol Tech Private Limited", email = "support@viprasol.com" }]
keywords = [
    "image-generation",
    "text-to-image",
    "stable-diffusion",
    "fastapi",
    "openai",
    "generative-ai",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Framework :: FastAPI",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Multimedia :: Graphics",
    "Typing :: Typed",
]
dependencies = [
    "fastapi>=0.110",
    "pydantic>=2.6",
    "uvicorn[standard]>=0.27",
]

[project.optional-dependencies]
openai = ["openai>=1.0"]
stable-diffusion = ["diffusers>=0.27", "torch>=2.0"]
dev = [
    "httpx>=0.27",
    "mypy>=1.8",
    "pytest>=8.0",
    "ruff>=0.4",
]

[project.urls]
Homepage = "https://viprasol.com"
Repository = "https://github.com/Viprasol-Tech/image-generation-api"
Issues = "https://github.com/Viprasol-Tech/image-generation-api/issues"

[project.scripts]
image-generation-api = "image_generation_api.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/image_generation_api"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "C4", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "E501"]
"src/image_generation_api/app.py" = ["B008"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src"]

[[tool.mypy.overrides]]
module = ["openai.*", "diffusers.*", "torch.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
pythonpath = ["src"]
